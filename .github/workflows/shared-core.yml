name: Shared core validation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/ssc_core/**'
      - 'tests/shared_control/**'
      - 'tests/fixtures/shared_control/**'
      - 'pyproject.toml'
      - 'docs/shared-package.md'
      - 'docs/reference/verify_evaluator_isolation.py'
      - 'docs/reference/verify_program_validation.py'
      - 'docs/reference/verify_intent_fusion.py'
      - 'docs/reference/intent_fixtures.py'
      - 'docs/reference/verify_optimizer.py'
      - 'docs/reference/verify_program_budget.py'
      - 'docs/reference/optimizer_fixtures.py'
      - 'docs/reference/archive_fixture.py'
      - 'docs/archive-replay.md'
      - 'docs/wiki/Generated-Constraint-Program-Contract.md'
      - 'docs/wiki/Offline-Batch-Profile.md'
      - '.github/workflows/shared-core.yml'

permissions:
  contents: read

jobs:
  wheel-and-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the shared package only
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel into a clean environment
        run: |
          python -m venv .venv-acceptance
          .venv-acceptance/bin/python -m pip install 'dist/ssc_core-0.10.0-py3-none-any.whl[test]'
      - name: Build a complete control-run archive on Linux
        run: |
          .venv-acceptance/bin/python -B docs/reference/archive_fixture.py \
            --source-revision "$(git rev-parse HEAD)" \
            --wheel-sha256 "$(sha256sum dist/*.whl | cut -d ' ' -f 1)" \
            --output archive-fixture.json > archive-checksum.json
      - name: Verify installed package
        run: |
          SSC_ARCHIVE_FIXTURE="$GITHUB_WORKSPACE/archive-fixture.json" \
            .venv-acceptance/bin/python -m pytest tests/shared_control --junitxml=test-results.xml
          .venv-acceptance/bin/python -m pip check
          .venv-acceptance/bin/python -m pip freeze > dependencies.txt
          sha256sum dist/*.whl > wheel-sha256.txt
      - name: Replay the archive in a fresh isolated process
        run: |
          .venv-acceptance/bin/python -I -m ssc_core.replay archive-fixture.json > archive-replay-evidence.json
      - name: Measure evaluator isolation on Linux
        run: |
          .venv-acceptance/bin/python -B docs/reference/verify_evaluator_isolation.py \
            --source-revision "$(git rev-parse HEAD)" \
            --wheel-sha256 "$(sha256sum dist/*.whl | cut -d ' ' -f 1)" \
            --output evaluator-evidence.json
      - name: Verify host receipt issuance and retain probes
        run: |
          .venv-acceptance/bin/python -B docs/reference/verify_program_validation.py \
            --source-revision "$(git rev-parse HEAD)" \
            --wheel-sha256 "$(sha256sum dist/*.whl | cut -d ' ' -f 1)" \
            --output program-validation-evidence.json
      - name: Verify deterministic intent support and fresh-process replay
        run: |
          .venv-acceptance/bin/python -B docs/reference/verify_intent_fusion.py \
            --source-revision "$(git rev-parse HEAD)" \
            --wheel-sha256 "$(sha256sum dist/*.whl | cut -d ' ' -f 1)" \
            --output intent-fusion-evidence.json
      - name: Verify supervised optimizer oracles, faults and residual replay
        run: |
          .venv-acceptance/bin/python -B docs/reference/verify_optimizer.py \
            --source-revision "$(git rev-parse HEAD)" \
            --wheel-sha256 "$(sha256sum dist/*.whl | cut -d ' ' -f 1)" \
            --output optimizer-evidence.json
      - name: Verify every allowed batch program count under the real solve budget
        if: ${{ !cancelled() }}
        run: |
          .venv-acceptance/bin/python -B docs/reference/verify_program_budget.py \
            --source-revision "$(git rev-parse HEAD)" \
            --wheel-sha256 "$(sha256sum dist/*.whl | cut -d ' ' -f 1)" \
            --output program-budget-evidence.json
      - name: Retain wheel and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssc-core-validation
          path: |
            dist/*.whl
            test-results.xml
            dependencies.txt
            wheel-sha256.txt
            evaluator-evidence.json
            program-validation-evidence.json
            intent-fusion-evidence.json
            optimizer-evidence.json
            program-budget-evidence.json
            archive-fixture.json
            archive-checksum.json
            archive-replay-evidence.json
